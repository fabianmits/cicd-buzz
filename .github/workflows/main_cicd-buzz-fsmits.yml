name: Build and deploy Python app to Azure Web App - cicd-buzz-fsmits

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          source antenv/bin/activate
          flake8 ./buzz/generator.py ./app.py --count --select=E9,F63,F7,F82 --show-source --statistics --ignore=F821
          flake8 ./buzz/generator.py ./app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          source antenv/bin/activate
          python -m pytest -v tests/test_generator.py

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "antenv/*"

      - name: Deploy via Kudu Zip Deploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USERNAME=$(python3 -c "import os,xml.etree.ElementTree as ET;r=ET.fromstring(os.environ['PUBLISH_PROFILE']);print([p.get('userName') for p in r.findall('publishProfile') if p.get('publishMethod')=='MSDeploy'][0])")
          PASSWORD=$(python3 -c "import os,xml.etree.ElementTree as ET;r=ET.fromstring(os.environ['PUBLISH_PROFILE']);print([p.get('userPWD') for p in r.findall('publishProfile') if p.get('publishMethod')=='MSDeploy'][0])")
          curl -X POST -u "$USERNAME:$PASSWORD" \
            --data-binary @release.zip \
            "https://cicd-buzz-fsmits.scm.azurewebsites.net/api/zipdeploy" \
            --connect-timeout 30 --max-time 300 \
            --fail --show-error
